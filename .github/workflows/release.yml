name: Release FCP

on:
  push:
    tags:
      - "fcp-v*"

permissions:
  contents: write
  id-token: write
  deployments: write

jobs:
  publish-fcp:
    permissions:
      contents: write
      id-token: write
      deployments: write
    uses: ChrisLally/lally-workflows/.github/workflows/release-publish.yml@2fdeceddf40d5c7148e782ad94136115941d57a1
    with:
      tag_prefix: "fcp-v"
      install_working_directory: "sdks/js"
      package_dir: "sdks/js"
      deployment_environment: "Preview - fcp"

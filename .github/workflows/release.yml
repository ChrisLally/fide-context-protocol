name: Release FCP

on:
  push:
    tags:
      - "fcp-v*"

permissions:
  contents: write
  id-token: write
  deployments: write

jobs:
  publish-fcp:
    permissions:
      contents: write
      id-token: write
      deployments: write
    uses: ChrisLally/lally-cli/.github/workflows/release-publish.yml@main
    with:
      tag_prefix: "fcp-v"
      package_dir: "sdks/js"
      deployment_environment: "Preview - fcp"
